general:
  device: cpu
  save_adv_example: true
model:
  input_shape: [-1, 1, 28, 28] 
attack:
  pgd_order: input_bab
  cex_path: ./test_cex.txt
solver:
  batch_size: 4096
  beta-crown:
    iteration: 20
    lr_beta: 0.03
    # Note: This flag is changed from True to False since its implementation needs to be checked.
    # The performance should not be affected much by this change.
    enable_opt_interm_bounds: False
  mip:
    parallel_solvers: 32
    solver_threads: 1
    refine_neuron_time_percentage: 0.8
  start_save_best: -1
bab:
  branching:
    candidates: 5
    reduceop: max
  timeout: 3000000.0
