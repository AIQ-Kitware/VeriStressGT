# polynomial.algebraic_boundary cross-verifier suite — 25 instances, 5 knob sweeps.
# All instances are UNSAT by construction.
#
# Baseline: degree=2, input_dim=10, hidden_dim=16, num_outputs=2,
#           num_lines=200, line_grid_points=80, eps_normal=0.1, delta_prime=0.08
#
# Group layout (5 instances each, one primary knob varied per group):
#   poly_deg_*   — degree:          2 → 4 → 6 → 10 → 14  (difficulty axis)
#   poly_dim_*   — input_dim:       4 → 8 → 12 → 16 → 20
#   poly_hid_*   — hidden_dim:      8 → 16 → 32 → 64 → 128
#   poly_eps_*   — eps_normal/delta_prime: wide → tight boundary margin
#   poly_lines_* — num_lines/line_grid_points: sparse → dense boundary sampling

name: polynomial_suite

defaults:
  seed: 0

instances:

  # ── Group 1: degree sweep ─────────────────────────────────────────────────
  - { id: poly_deg_01, construction: polynomial.algebraic_boundary, seed: 1,  args: { degree: 2,  input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_deg_02, construction: polynomial.algebraic_boundary, seed: 2,  args: { degree: 3,  input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_deg_03, construction: polynomial.algebraic_boundary, seed: 3,  args: { degree: 4,  input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_deg_04, construction: polynomial.algebraic_boundary, seed: 4,  args: { degree: 5, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_deg_05, construction: polynomial.algebraic_boundary, seed: 5,  args: { degree: 6, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }

  # ── Group 2: input_dim sweep ──────────────────────────────────────────────
  - { id: poly_dim_01, construction: polynomial.algebraic_boundary, seed: 6,  args: { degree: 3, input_dim: 4,  hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_dim_02, construction: polynomial.algebraic_boundary, seed: 7,  args: { degree: 3, input_dim: 8,  hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_dim_03, construction: polynomial.algebraic_boundary, seed: 8,  args: { degree: 3, input_dim: 12, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_dim_04, construction: polynomial.algebraic_boundary, seed: 9,  args: { degree: 3, input_dim: 16, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_dim_05, construction: polynomial.algebraic_boundary, seed: 10, args: { degree: 3, input_dim: 20, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }

  # ── Group 3: hidden_dim sweep ─────────────────────────────────────────────
  - { id: poly_hid_01, construction: polynomial.algebraic_boundary, seed: 11, args: { degree: 3, input_dim: 10, hidden_dim: 8,   num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_hid_02, construction: polynomial.algebraic_boundary, seed: 12, args: { degree: 3, input_dim: 10, hidden_dim: 16,  num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_hid_03, construction: polynomial.algebraic_boundary, seed: 13, args: { degree: 3, input_dim: 10, hidden_dim: 32,  num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_hid_04, construction: polynomial.algebraic_boundary, seed: 14, args: { degree: 3, input_dim: 10, hidden_dim: 64,  num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_hid_05, construction: polynomial.algebraic_boundary, seed: 15, args: { degree: 3, input_dim: 10, hidden_dim: 128, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }

  # ── Group 4: eps_normal / delta_prime sweep (boundary margin) ─────────────
  - { id: poly_eps_01, construction: polynomial.algebraic_boundary, seed: 16, args: { degree: 2, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.15, delta_prime: 0.12 } }
  - { id: poly_eps_02, construction: polynomial.algebraic_boundary, seed: 17, args: { degree: 2, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.12, delta_prime: 0.10 } }
  - { id: poly_eps_03, construction: polynomial.algebraic_boundary, seed: 18, args: { degree: 2, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.10, delta_prime: 0.08 } }
  - { id: poly_eps_04, construction: polynomial.algebraic_boundary, seed: 19, args: { degree: 2, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.08, delta_prime: 0.06 } }
  - { id: poly_eps_05, construction: polynomial.algebraic_boundary, seed: 20, args: { degree: 2, input_dim: 10, hidden_dim: 16, num_outputs: 2, num_lines: 200, line_grid_points: 80,  eps_normal: 0.05, delta_prime: 0.04 } }