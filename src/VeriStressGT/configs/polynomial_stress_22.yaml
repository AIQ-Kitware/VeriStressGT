name: polynomial_stress_22

defaults:
  input_dim: 100
  hidden_dim: 100
  degree: 10
  num_outputs: 2

  init_mode: fanin
  eps_normal: 0.02
  delta_prime: 0.005

  num_lines: 1400
  center_scale: 2.0
  line_t_min: -10.0
  line_t_max: 10.0
  line_grid_points: 240
  boundary_tol: 1.0e-6
  boundary_rel_tol: 1.0e-10
  unique_tol: 1.0e-4

  max_candidates: 5
  candidate_margin_tol: 1.0e-8
  grad_tol: 1.0e-12

  nbc_num_restarts: 50
  nbc_max_iter: 500
  nbc_boundary_tol: 1.0e-10
  nbc_ftol: 1.0e-15
  nbc_gtol: 1.0e-10

  weight_scale: 1.0
  bias_scale: 1.0
  output_weight_scale: 1.0
  output_bias_scale: 1.0
  bias_base_scale: 0.1
  output_bias_base_scale: 0.1

  opset: 13

instances:
  # Tier 0: very easy sanity checks.
  # Pilot results suggest these should solve quickly and establish a low-stress baseline.
  - id: poly01_easy_N50_d10
    construction: polynomial.algebraic_boundary
    seed: 101
    args:
      input_dim: 50
      hidden_dim: 100
      degree: 10
      delta_prime: 0.005

  - id: poly02_easy_d2
    construction: polynomial.algebraic_boundary
    seed: 102
    args:
      degree: 2
      delta_prime: 0.005

  - id: poly03_easy_d6
    construction: polynomial.algebraic_boundary
    seed: 103
    args:
      degree: 6
      delta_prime: 0.005

  - id: poly04_easy_d10_h50
    construction: polynomial.algebraic_boundary
    seed: 104
    args:
      hidden_dim: 50
      degree: 10
      delta_prime: 0.005

  - id: poly05_easy_d10_h500
    construction: polynomial.algebraic_boundary
    seed: 105
    args:
      hidden_dim: 500
      degree: 10
      delta_prime: 0.005

  # Tier 1: still expected easy, but approaching the degree transition.
  - id: poly06_deg12
    construction: polynomial.algebraic_boundary
    seed: 106
    args:
      degree: 12
      delta_prime: 0.005

  - id: poly07_deg14
    construction: polynomial.algebraic_boundary
    seed: 107
    args:
      degree: 14
      delta_prime: 0.005

  - id: poly08_deg16
    construction: polynomial.algebraic_boundary
    seed: 108
    args:
      degree: 16
      delta_prime: 0.005

  - id: poly09_deg17
    construction: polynomial.algebraic_boundary
    seed: 109
    args:
      degree: 17
      delta_prime: 0.005

  # Tier 2: transition region from the pilot table.
  # d=18 was the first observed timeout region; d=19 fills the gap before d=20.
  - id: poly10_deg18_a
    construction: polynomial.algebraic_boundary
    seed: 110
    args:
      degree: 18
      delta_prime: 0.005

  - id: poly11_deg18_b
    construction: polynomial.algebraic_boundary
    seed: 111
    args:
      degree: 18
      delta_prime: 0.005

  - id: poly12_deg19_a
    construction: polynomial.algebraic_boundary
    seed: 112
    args:
      degree: 19
      delta_prime: 0.005

  - id: poly13_deg19_b
    construction: polynomial.algebraic_boundary
    seed: 113
    args:
      degree: 19
      delta_prime: 0.005

  # Tier 3: hard degree-only cases.
  - id: poly14_deg20
    construction: polynomial.algebraic_boundary
    seed: 114
    args:
      degree: 20
      delta_prime: 0.005

  - id: poly15_deg21
    construction: polynomial.algebraic_boundary
    seed: 115
    args:
      degree: 21
      delta_prime: 0.005

  - id: poly16_deg22
    construction: polynomial.algebraic_boundary
    seed: 116
    args:
      degree: 22
      delta_prime: 0.005
      num_lines: 1800

  # Tier 4: boundary-buffer sweep at fixed d=10.
  # Pilot results: 5e-3 easy, 1e-3 medium, 1e-4 very hard.
  - id: poly17_delta2e3
    construction: polynomial.algebraic_boundary
    seed: 117
    args:
      degree: 10
      delta_prime: 0.002

  - id: poly18_delta1e3
    construction: polynomial.algebraic_boundary
    seed: 118
    args:
      degree: 10
      delta_prime: 0.001

  - id: poly19_delta5e4
    construction: polynomial.algebraic_boundary
    seed: 119
    args:
      degree: 10
      delta_prime: 0.0005

  - id: poly20_delta2e4
    construction: polynomial.algebraic_boundary
    seed: 120
    args:
      degree: 10
      delta_prime: 0.0002

  - id: poly21_delta1e4
    construction: polynomial.algebraic_boundary
    seed: 121
    args:
      degree: 10
      delta_prime: 0.0001

  # Tier 5: combined hard case, but not absurdly extreme.
  - id: poly22_combo_deg18_delta1e3
    construction: polynomial.algebraic_boundary
    seed: 122
    args:
      degree: 18
      delta_prime: 0.001
      num_lines: 1800
      nbc_num_restarts: 75
