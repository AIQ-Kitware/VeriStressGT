# UCLA — VeriStressGT Mini Sweep Evaluation
#
# 50 instances across 7 construction types. All instances are UNSAT by
# construction. Verifiers: abcrown, pyrat, nnenum.
#
# After verification, difficulty profiles are computed for every instance
# (margin_sample_min, ibp_relative_gap, unstable_frac, A_tau_effective_log,
# effective_grad_dim_mean) and a timeout-AUC heatmap is saved alongside
# results.json: construction_heatmap.png and timeout_auc_heatmap.png.
#
# Claim: abcrown achieves >= threshold correct UNSAT verdicts.

title: "VeriStressGT Mini Sweep Evaluation (50 instances, 7 constructions)"
description: |
  Generates 50 instances across 7 construction types (mlp_relu.meap,
  milp.exact_radius, corners, cnn.deep_contractive_cnn, cnn.cnn_paired_bias,
  attention.linear_dominance, attention.fixed_pattern). Every instance is
  guaranteed UNSAT by construction. Runs abcrown, pyrat, and nnenum, then
  computes difficulty profile components and saves a construction heatmap
  and timeout-AUC heatmap.

version: 1.0

organizations:
  - UCLA

submitter:
  name: UCLA TA1 Team
  email: davidtroxell@g.ucla.edu

tags:
  - ucla
  - cross-verifier
  - sweep
  - mlp
  - cnn
  - attention

links:
  - title: "VeriStressGT"
    url: "https://github.com/dtroxell19/VeriStressGT"
    type: "software"

symbols:
  threshold:
    type: float
    value: 0.6

claim:
  python: |
    assert not per_verifier["abcrown"]["skipped"], (
      "abcrown was skipped — check ABCROWN_VNNCOMP2024_DIR / conda env"
    )
    assert per_verifier["abcrown"]["correct_fraction"] >= threshold, (
      f"abcrown matched ground truth on only "
      f"{per_verifier['abcrown']['correct']}/{per_verifier['abcrown']['total']} "
      f"instances (fraction={per_verifier['abcrown']['correct_fraction']:.2f}, "
      f"required >= {threshold:.2f}). "
      f"Summary: {summary['per_verifier_fraction']}"
    )

pipeline:
  mini_sweep:
    executable: 'python -u aiq/mini_sweep_runner.py'
    algo_params:
      spec_path: 'src/VeriStressGT/configs/mini_sweep.yaml'
      bench_dir: 'mini_sweep_bench'
      run_dir: 'mini_sweep_run'
      timeout: 60
      abcrown_config: 'src/VeriStressGT/configs/abcrown_basic.yaml'
    out_paths:
      results_fpath: 'results.json'
