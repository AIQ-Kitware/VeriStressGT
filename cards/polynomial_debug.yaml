# UCLA — Algebraic PNN Verification — VeriStressGT polynomial constructor debug card
#
# Claim: on three small polynomial.algebraic_boundary instances (degree=2,
# input_dim=3/5/10), the algebraic verifier returns UNSAT on every instance.
# All instances are UNSAT by construction (is_robust=True guaranteed by the
# numerical nearest-boundary certificate).

title: "Algebraic Verification of VeriStressGT Polynomial Networks (Debug)"
description: |
  The algebraic verifier (Homotopy Continuation on the polynomial decision
  boundary) is run against three small instances generated by VeriStressGT's
  polynomial.algebraic_boundary constructor. Each instance is guaranteed UNSAT
  by a numerical multi-start L-BFGS-B nearest-boundary certificate. The claim
  asserts the verifier agrees with ground truth on every instance.

version: 1.0

organizations:
  - UCLA

submitter:
  name: UCLA TA1 Team
  email: edwardduanhao@gmail.com

tags:
  - debug
  - ucla
  - algebraic
  - polynomial
  - homotopy-continuation

links:
  - title: "AlgebraicVerification"
    url: "https://github.com/edwardduanhao/AlgebraicVerification"
    type: "software"
  - title: "VeriStressGT"
    url: "https://github.com/dtroxell19/VeriStressGT"
    type: "software"

claim:
  python: |
    assert correct_fraction >= threshold, (
      f"Algebraic verifier matched ground truth on only "
      f"{correct_count}/{total} instances (fraction={correct_fraction:.2f}, "
      f"required >= {threshold:.2f}). Per-instance: {per_instance}"
    )

pipeline:
  polynomial_verify:
    executable: 'python aiq/polynomial_debug_runner.py'
    algo_params:
      spec_path: 'src/VeriStressGT/configs/polynomial_debug.yaml'
      bench_dir: './polynomial_debug_bench'
      run_dir: './polynomial_debug_run'
      timeout: 300
    out_paths:
      results_fpath: 'results.json'

symbols:
  threshold:
    type: float
    value: 1.0
